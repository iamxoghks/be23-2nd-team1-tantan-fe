<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="980" viewBox="0 0 1700 980">
  <defs>
    <style>
      .bg { fill: #f5f7fb; }
      .title { font: 700 30px Arial, sans-serif; fill: #111827; }
      .sub { font: 600 16px Arial, sans-serif; fill: #4b5563; }
      .zone-title { font: 700 20px Arial, sans-serif; fill: #111827; }
      .node-title { font: 700 14px Arial, sans-serif; fill: #111827; }
      .node-text { font: 600 12px Arial, sans-serif; fill: #4b5563; }
      .tiny { font: 600 11px Arial, sans-serif; fill: #6b7280; }
      .frame { fill: #e5e7eb; stroke: #9ca3af; stroke-width: 2; rx: 14; ry: 14; }
      .zone-fe { fill: #e0f2fe; stroke: #7dd3fc; stroke-width: 2; rx: 14; ry: 14; }
      .zone-be { fill: #dcfce7; stroke: #86efac; stroke-width: 2; rx: 14; ry: 14; }
      .zone-data { fill: #fff7ed; stroke: #fdba74; stroke-width: 2; rx: 14; ry: 14; }
      .zone-es { fill: #fef3c7; stroke: #fcd34d; stroke-width: 2; rx: 14; ry: 14; }
      .zone-ext { fill: #fef2f2; stroke: #fca5a5; stroke-width: 2; rx: 14; ry: 14; }
      .node { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.6; rx: 10; ry: 10; }
      .actor { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.6; rx: 10; ry: 10; }
      .http { stroke: #2563eb; stroke-width: 2.4; fill: none; marker-end: url(#arrBlue); }
      .rt { stroke: #10b981; stroke-width: 2.4; fill: none; marker-end: url(#arrGreen); }
      .data { stroke: #ef4444; stroke-width: 2.4; fill: none; marker-end: url(#arrRed); }
      .search { stroke: #d97706; stroke-width: 2.4; fill: none; marker-end: url(#arrAmber); }
    </style>
    <marker id="arrBlue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#2563eb"/>
    </marker>
    <marker id="arrGreen" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#10b981"/>
    </marker>
    <marker id="arrRed" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#ef4444"/>
    </marker>
    <marker id="arrAmber" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#d97706"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1700" height="980" class="bg"/>
  <text x="30" y="44" class="title">TanTan System Architecture</text>
  <text x="30" y="70" class="sub">Naver Cloud Hosting: FE + BE + MariaDB + Redis + Elasticsearch</text>

  <!-- Actors -->
  <rect x="24" y="110" width="180" height="820" class="frame"/>
  <text x="44" y="144" class="zone-title">Clients</text>
  <rect x="44" y="176" width="140" height="86" class="actor"/>
  <text x="60" y="208" class="node-title">User</text>
  <text x="60" y="230" class="node-text">Web / Mobile</text>

  <rect x="44" y="286" width="140" height="86" class="actor"/>
  <text x="60" y="318" class="node-title">Gym Owner</text>
  <text x="60" y="340" class="node-text">운영 기능</text>

  <rect x="44" y="396" width="140" height="86" class="actor"/>
  <text x="60" y="428" class="node-title">Admin</text>
  <text x="60" y="450" class="node-text">신고/관리</text>

  <!-- Naver Cloud runtime -->
  <rect x="220" y="110" width="1450" height="820" class="frame"/>
  <text x="242" y="144" class="zone-title">Naver Cloud Runtime</text>

  <!-- FLOW LINES (draw first so boxes stay above) -->
  <!-- clients -> frontend -->
  <path d="M184 220 L280 220 L280 210 L360 210" class="http"/>
  <path d="M184 330 L280 330 L280 236 L360 236" class="http"/>
  <path d="M184 440 L280 440 L280 262 L360 262" class="http"/>

  <!-- frontend -> backend -->
  <path d="M690 230 L760 230 L760 210 L850 210" class="http"/>
  <path d="M690 254 L820 254 L820 320" class="http"/>
  <path d="M690 278 L860 278 L860 320" class="rt"/>

  <!-- backend -> data -->
  <path d="M1210 510 L1210 620 L980 620" class="data"/>
  <path d="M1240 510 L1240 650 L1160 650" class="data"/>

  <!-- backend <-> elasticsearch -->
  <path d="M1180 350 L1280 350 L1280 300" class="search"/>
  <path d="M1280 320 L1220 320" class="search"/>

  <!-- backend -> external -->
  <path d="M1240 430 L1360 430 L1360 490" class="http"/>

  <!-- frontend -> external realtime -->
  <path d="M690 300 L1360 300 L1360 560" class="rt"/>

  <!-- Frontend zone -->
  <rect x="240" y="170" width="470" height="170" class="zone-fe"/>
  <text x="262" y="202" class="zone-title">Frontend</text>
  <rect x="260" y="212" width="120" height="98" class="node"/>
  <text x="278" y="246" class="node-title">DNS / Route</text>
  <text x="278" y="266" class="tiny">도메인 진입</text>

  <rect x="392" y="212" width="120" height="98" class="node"/>
  <text x="412" y="246" class="node-title">Static Host</text>
  <text x="412" y="266" class="tiny">Vite build</text>

  <rect x="524" y="212" width="166" height="98" class="node"/>
  <text x="544" y="246" class="node-title">Vue 3 App</text>
  <text x="544" y="266" class="node-text">axios + STOMP client</text>

  <!-- Backend zone -->
  <rect x="760" y="170" width="490" height="390" class="zone-be"/>
  <text x="782" y="202" class="zone-title">Backend</text>

  <rect x="780" y="212" width="450" height="84" class="node"/>
  <text x="800" y="244" class="node-title">Ingress &amp; Security</text>
  <text x="800" y="264" class="node-text">JWT Filter, CORS, OAuth2, /ws endpoint</text>

  <rect x="780" y="320" width="138" height="98" class="node"/>
  <text x="796" y="352" class="node-title">User/Auth</text>
  <text x="796" y="372" class="tiny">profile, follow</text>

  <rect x="930" y="320" width="138" height="98" class="node"/>
  <text x="946" y="352" class="node-title">Gym/Workout</text>
  <text x="946" y="372" class="tiny">map, review</text>

  <rect x="1080" y="320" width="150" height="98" class="node"/>
  <text x="1096" y="352" class="node-title">Community/Chat</text>
  <text x="1096" y="372" class="tiny">post/comment/like</text>

  <rect x="780" y="442" width="450" height="98" class="node"/>
  <text x="800" y="474" class="node-title">Service Layer</text>
  <text x="800" y="494" class="node-text">JPA + Redis + Search + SSE + Mail + Image</text>
  <text x="800" y="514" class="tiny">DelYn soft delete, async/batch</text>

  <!-- Elasticsearch zone -->
  <rect x="1268" y="170" width="382" height="190" class="zone-es"/>
  <text x="1290" y="202" class="zone-title">Elasticsearch (Search)</text>
  <rect x="1288" y="224" width="342" height="112" class="node"/>
  <text x="1310" y="258" class="node-title">Search Index</text>
  <text x="1310" y="280" class="node-text">gym / community / chat documents</text>
  <text x="1310" y="300" class="tiny">query + indexing services</text>

  <!-- Data zone -->
  <rect x="760" y="590" width="490" height="190" class="zone-data"/>
  <text x="782" y="622" class="zone-title">Data (Redis / MariaDB)</text>
  <rect x="780" y="640" width="180" height="112" class="node"/>
  <text x="802" y="676" class="node-title">MariaDB</text>
  <text x="802" y="698" class="node-text">Main transaction DB</text>
  <text x="802" y="718" class="tiny">user/gym/post/comment/chat</text>

  <rect x="1060" y="640" width="170" height="112" class="node"/>
  <text x="1082" y="676" class="node-title">Redis</text>
  <text x="1082" y="698" class="node-text">token/index/cache</text>
  <text x="1082" y="718" class="tiny">RT/AT + counters</text>

  <!-- External zone -->
  <rect x="1268" y="390" width="382" height="390" class="zone-ext"/>
  <text x="1290" y="422" class="zone-title">External</text>
  <rect x="1288" y="438" width="342" height="98" class="node"/>
  <text x="1310" y="472" class="node-title">Naver Map API</text>
  <text x="1310" y="494" class="node-text">geocode / reverse-geocode</text>

  <rect x="1288" y="552" width="342" height="98" class="node"/>
  <text x="1310" y="586" class="node-title">OAuth2 Providers</text>
  <text x="1310" y="608" class="node-text">Google / Kakao / Naver</text>

  <rect x="1288" y="666" width="342" height="98" class="node"/>
  <text x="1310" y="700" class="node-title">SMTP + AWS S3</text>
  <text x="1310" y="722" class="node-text">email / image object storage</text>

  <!-- Legend -->
  <rect x="240" y="820" width="1410" height="90" class="node"/>
  <text x="262" y="854" class="node-title">Legend</text>
  <line x1="340" y1="850" x2="406" y2="850" class="http"/>
  <text x="416" y="854" class="node-text">HTTP API</text>
  <line x1="560" y1="850" x2="626" y2="850" class="rt"/>
  <text x="636" y="854" class="node-text">Realtime (SSE/STOMP)</text>
  <line x1="920" y1="850" x2="986" y2="850" class="data"/>
  <text x="996" y="854" class="node-text">Data access (Redis/MariaDB)</text>
  <line x1="1300" y1="850" x2="1366" y2="850" class="search"/>
  <text x="1376" y="854" class="node-text">Search flow (Elasticsearch)</text>
</svg>
