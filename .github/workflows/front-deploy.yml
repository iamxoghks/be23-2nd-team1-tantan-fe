name: deploy to s3, cloudfront

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: setup nodejs
        uses: actions/setup-node@v2
        with:
          node-version: '20' # 현재 안정적인 버전인 20을 권장합니다.

      - name: npm install
        working-directory: .
        run: npm install
            
      - name: setup aws cli
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: "ap-northeast-2"

      - name: npm build
        working-directory: .
        # 빌드 시점에 환경 변수를 주입해야 dist 폴더에 값이 하드코딩됩니다.
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_WS_BASE_URL: ${{ secrets.VITE_WS_BASE_URL }}
          VITE_NAVER_MAP_KEY_ID: ${{ secrets.VITE_NAVER_MAP_KEY_ID }}
          VITE_NAVER_MAP_SUBMODULES: "geocoder"
        run: npm run build

      - name: deploy to s3
        run: aws s3 sync ./dist s3://server.nahcb572.shop/ --delete
        # cp 대신 sync --delete를 쓰면 S3의 옛날 파일들을 정리해줘서 더 깔끔합니다.

      - name: invalidate cloudfront
        run: aws cloudfront create-invalidation --distribution-id E27K8LKO70Q004 --paths "/*"